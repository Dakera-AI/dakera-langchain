name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ contains(github.event.pull_request.labels.*.name, 'full-matrix') && fromJson('["3.10","3.11","3.12"]') || fromJson('["3.10","3.12"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports

      - name: Security audit
        # Python 3.10 is end of life: fixed releases of some dependencies (filelock >= 4.2.1,
        # pillow >= 13) need Python >= 3.11, so their advisories cannot be fixed on 3.10.
        if: matrix.python-version != '3.10'
        run: |
          pip install --upgrade pip setuptools
          pip-audit --ignore-vuln CVE-2026-3219

      - name: Test with pytest
        run: pytest tests/ -v --tb=short
