[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-dakera"
version = "0.4.0"
description = "LangChain integration for the Dakera AI memory platform"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dakera Team"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["langchain", "dakera", "memory", "vector", "ai", "rag"]
dependencies = ["dakera>=0.14.1", "langchain-core>=0.1.0"]

[project.optional-dependencies]
# LangChain >= 1.0 moved BaseMemory and the legacy chains (ConversationChain, ...)
# to langchain-classic; install it to plug DakeraMemory into those chains.
classic = ["langchain-classic>=1.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "responses>=0.23.0",
       "ruff>=0.1.0", "langchain-core>=0.1.0", "mypy>=1.0.0", "pip-audit>=2.0.0",
       "langchain-classic>=1.0"]

[project.urls]
Homepage = "https://github.com/dakera-ai/dakera-langchain"
Documentation = "https://dakera.ai/integrations/langchain.html"
Repository = "https://github.com/dakera-ai/dakera-langchain"
Changelog = "https://github.com/Dakera-AI/dakera-langchain/blob/main/CHANGELOG.md"
Issues = "https://github.com/Dakera-AI/dakera-langchain/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langchain_dakera = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: live tests against a Dakera server (need DAKERA_API_URL)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
